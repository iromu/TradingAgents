# Observability configuration for Spring AI with tracing and logging
spring:
  ai:
    chat:
      observations:
        log-prompt: false # Include prompt content in tracing (disabled by default for privacy)
        log-completion: false # Include completion content in tracing (disabled by default)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 0.1 # Sample 10% of requests for production tracing
    enabled: true
  observations:
    annotations:
      enabled: true # Enable @Observed (if you use observation annotations in code)
  otlp:
    tracing:
      endpoint: https://langfuse.iromu.org/api/public/otel/v1/traces
      transport: http
